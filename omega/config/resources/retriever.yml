retriever:
  backend: sqlite_fts
  sqlite_fts:
    source_root: data/smoke_sources/domain_docs
    include_extensions: [".txt", ".md", ".html", ".htm", ".pdf", ".docx"]
    default_top_k: 4
    attachments:
      enabled: true
      max_file_bytes: 20971520
      max_extracted_chars: 200000
      max_chunk_chars: 2000
      chunk_overlap: 200
      html_include_hidden: true
      strict_magic: true
      sandbox:
        enabled: true
        timeout_sec: 10
        max_memory_mb: 1024
        max_cpu_sec: 12
      parser_limits:
        max_pdf_pages: 250
        max_docx_entries: 2000
        max_docx_uncompressed_bytes: 67108864
        max_image_pixels: 40000000
        max_html_nodes: 200000
      visual:
        enabled: false
        render_pdf_pages: true
        extract_embedded_images: true
        max_assets: 8
        max_total_bytes: 33554432
        max_asset_bytes: 8388608
        max_pdf_pages: 8
        pdf_dpi: 120
        max_pdf_pixels_per_page: 16000000
        min_width: 32
        min_height: 32
        failure_policy: degrade
      hidden_chunk_prefix: "[hidden_html]"
      scan_like_min_chars_per_page: 25
      scan_like_min_alpha_ratio: 0.30
      ocr:
        enabled: false
        provider: rapidocr
        execution_mode: inline
        prewarm: false
        worker_startup_timeout_sec: 25
        worker_request_timeout_sec: 15
        worker_max_memory_mb: 2048
        worker_max_requests: 500
        worker_pool_size: 1
        worker_max_pending_requests: 2
        worker_queue_timeout_sec: 1.0
        worker_intra_op_threads: 2
        worker_inter_op_threads: 1
        lang: en
        use_angle_cls: true
        max_text_chars: 200000
        max_spans_per_chunk: 8
        min_confidence: 0.55
        max_spans: 256
        max_span_chars: 512
        require_geometry: true
        min_polygon_area_px: 4.0
        failure_policy: degrade
      zip:
        enabled: false
        max_files: 100
        max_depth: 5
        max_total_bytes: 20971520
        allow_encrypted: false
  external:
    enabled: false
