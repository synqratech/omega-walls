name: framework-matrix-nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-workflow-and-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python scripts/run_framework_matrix_stand.py --layer workflow --profile dev --strict
      - run: python scripts/run_framework_stress_chaos.py --profile dev --strict
