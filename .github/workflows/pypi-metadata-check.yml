name: pypi-metadata-check

on:
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"
      - "README_PYPI.md"
      - ".github/workflows/pypi-metadata-check.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "README_PYPI.md"
      - ".github/workflows/pypi-metadata-check.yml"

jobs:
  validate-pypi-metadata:
    name: validate-pypi-metadata (py3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate distribution metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*
