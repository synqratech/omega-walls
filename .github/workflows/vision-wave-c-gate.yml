name: Vision Wave C Multimodal Trust Boundary

on:
  pull_request:
    paths:
      - "omega/rag/attachment_*.py"
      - "omega/vision/**"
      - "omega/api/**"
      - "omega/sdk.py"
      - "omega/rag/harness.py"
      - "omega/projector/api_hybrid/**"
      - "omega/projector/api_hybrid_projector.py"
      - "omega/config/**"
      - "config/profiles/*.yml"
      - "config/release_gate.yml"
      - "tests/data/vision_wave_c_frozen/**"
      - "tests/test_vision_wave_c.py"
      - "scripts/*vision_wave_c*.py"
      - ".github/workflows/vision-wave-c-gate.yml"
  push:
    branches: [main]
    paths:
      - "omega/rag/attachment_*.py"
      - "omega/vision/**"
      - "omega/api/**"
      - "omega/sdk.py"
      - "omega/rag/harness.py"
      - "omega/projector/api_hybrid/**"
      - "omega/projector/api_hybrid_projector.py"
      - "omega/config/**"
      - "config/profiles/*.yml"
      - "config/release_gate.yml"
      - "tests/data/vision_wave_c_frozen/**"
      - "tests/test_vision_wave_c.py"
      - "scripts/*vision_wave_c*.py"
      - ".github/workflows/vision-wave-c-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install multimodal document dependencies
        run: python -m pip install -e ".[dev,api,attachments]" pillow
      - name: Validate committed Wave C artifact
        run: python scripts/check_vision_wave_c_gate.py
      - name: Re-run deterministic Wave C contract gate
        run: |
          python scripts/eval_vision_wave_c_frozen.py --output artifacts/vision_wave_c/frozen/ci-regenerated.json
          python scripts/check_vision_wave_c_gate.py --report artifacts/vision_wave_c/frozen/ci-regenerated.json
      - name: Run Wave C contract regressions
        run: |
          python -m pytest -q \
            tests/test_vision_wave_c.py \
            tests/test_vision_phase1_wave_a.py \
            tests/test_vision_wave_b.py \
            tests/test_attachment_ingestion.py \
            tests/test_api_attachment_scan.py \
            tests/test_api_hybrid_projector.py \
            tests/test_sdk_facade.py \
            tests/test_integration_harness.py

  local-multiformat-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production local vision path
        run: python -m pip install -e ".[dev,api,attachments,ocr]"
      - name: Validate committed local Wave C artifact
        run: python scripts/check_vision_wave_c_local_gate.py
      - name: Re-run local PDF and embedded-image quality gate
        run: |
          python scripts/eval_vision_wave_c_local.py --output artifacts/vision_wave_c/local/ci-regenerated.json
          python scripts/check_vision_wave_c_local_gate.py --report artifacts/vision_wave_c/local/ci-regenerated.json
