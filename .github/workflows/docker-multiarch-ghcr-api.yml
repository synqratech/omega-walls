name: docker-multiarch-ghcr-api

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.vision"
      - "omega/**"
      - "config/**"
      - "scripts/check_docker_image_hygiene.py"
      - ".github/workflows/docker-multiarch-ghcr-api.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate image contents
        run: python scripts/check_docker_image_hygiene.py
      - name: Build local smoke image
        run: docker build --pull --tag omega-walls-api:smoke .
      - name: Smoke API routes
        shell: bash
        run: |
          docker run --rm -d --name omega-api-smoke -p 8080:8080 \
            -e OMEGA_PROFILE=prod \
            -e OMEGA_API_KEYS=0123456789abcdef0123456789abcdef \
            -e OMEGA_API_HMAC_SECRET=abcdef0123456789abcdef0123456789abcdef0123456789 \
            omega-walls-api:smoke
          trap 'docker logs omega-api-smoke || true; docker stop omega-api-smoke || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/openapi.json | grep -F '/v1/scan/attachment'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/omega-walls-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
