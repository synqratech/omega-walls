name: framework-contract-gate

on:
  pull_request:
    paths:
      - "integrations/**"
      - "omega/integrations/**"
      - "tests/test_*guard*.py"
      - "scripts/run_framework_matrix_stand.py"
      - ".github/workflows/framework-contract-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-contract:
    runs-on: ubuntu-latest
    env:
      OMEGA_RUN_INTEGRATION_EXEC_TESTS: "1"
      OMEGA_RUN_OPENCLAW_LAUNCHER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate integration package contract
        run: python -m pytest -q tests/test_docs_integrations_contract.py tests/test_framework_smokes.py
      - name: Run framework contract stand
        run: python scripts/run_framework_matrix_stand.py --layer contract --profile dev --strict
