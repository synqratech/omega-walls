name: package-install-smoke

on:
  pull_request:
    paths:
      - "omega/**"
      - "config/**"
      - "pyproject.toml"
      - "release/**"
      - "MANIFEST.in"
      - "scripts/smoke_package_install.py"
      - "scripts/check_commercial_boundary.py"
      - ".github/workflows/package-install-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python scripts/smoke_package_install.py
