name: Vision Wave B OCR and Spatial Gate

on:
  pull_request:
    paths:
      - "omega/vision/**"
      - "omega/rag/attachment_ingestion.py"
      - "omega/api/ocr_*.py"
      - "omega/api/scan_request_orchestration.py"
      - "omega/projector/api_hybrid/**"
      - "omega/projector/api_hybrid_projector.py"
      - "omega/config/**"
      - "config/profiles/*.yml"
      - "tests/data/vision_wave_b_frozen/**"
      - "tests/test_vision_wave_b*.py"
      - "scripts/*vision_wave_b*.py"
      - ".github/workflows/vision-wave-b-gate.yml"
  push:
    branches: [main]
    paths:
      - "omega/vision/**"
      - "omega/rag/attachment_ingestion.py"
      - "omega/api/ocr_*.py"
      - "omega/api/scan_request_orchestration.py"
      - "omega/projector/api_hybrid/**"
      - "omega/projector/api_hybrid_projector.py"
      - "omega/config/**"
      - "config/profiles/*.yml"
      - "tests/data/vision_wave_b_frozen/**"
      - "tests/test_vision_wave_b*.py"
      - "scripts/*vision_wave_b*.py"
      - ".github/workflows/vision-wave-b-gate.yml"

permissions:
  contents: read

jobs:
  frozen-comparative-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Wave B dependencies
        run: python -m pip install -e ".[dev,api,attachments]" pillow
      - name: Validate committed frozen artifact
        run: python scripts/check_vision_wave_b_gate.py
      - name: Re-run deterministic comparative gate
        run: |
          python scripts/eval_vision_wave_b_frozen.py --output artifacts/vision_wave_b/frozen/ci-regenerated.json
          python scripts/check_vision_wave_b_gate.py --report artifacts/vision_wave_b/frozen/ci-regenerated.json
      - name: Run Wave B regressions
        run: |
          python -m pytest -q \
            tests/test_vision_wave_b.py \
            tests/test_vision_wave_b_frozen_gate.py \
            tests/test_ocr_adjudication.py \
            tests/test_ocr_span_attribution.py \
            tests/test_attachment_ingestion.py \
            tests/test_api_attachment_scan.py \
            tests/test_api_hybrid_projector.py

  local-rapidocr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production OCR path
        run: python -m pip install -e ".[dev,api,attachments,ocr]"
      - name: Validate committed local OCR artifact
        run: python scripts/check_vision_wave_b_local_ocr_gate.py
      - name: Re-run real RapidOCR gate
        run: |
          python scripts/eval_vision_wave_b_local_ocr.py --output artifacts/vision_wave_b/local_rapidocr/ci-regenerated.json
          python scripts/check_vision_wave_b_local_ocr_gate.py --report artifacts/vision_wave_b/local_rapidocr/ci-regenerated.json
