name: openclaw-plugin-ci

on:
  pull_request:
    paths:
      - "integrations/openclaw/**"
      - "plugins/openclaw-omega-guard/**"
      - ".github/workflows/openclaw-plugin-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Detect Node plugin package
        id: node-plugin
        shell: bash
        run: |
          if [[ -f plugins/openclaw-omega-guard/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Node dependencies
        if: steps.node-plugin.outputs.present == 'true'
        working-directory: plugins/openclaw-omega-guard
        run: npm ci
      - name: Typecheck Node plugin
        if: steps.node-plugin.outputs.present == 'true'
        working-directory: plugins/openclaw-omega-guard
        run: npm run typecheck
      - name: Test Node plugin
        if: steps.node-plugin.outputs.present == 'true'
        working-directory: plugins/openclaw-omega-guard
        run: npm run test
      - name: Build Node plugin
        if: steps.node-plugin.outputs.present == 'true'
        working-directory: plugins/openclaw-omega-guard
        run: npm run build
      - name: Validate current Python integration fallback
        if: steps.node-plugin.outputs.present != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_openclaw_plugin_contract.py integrations/openclaw/test_integration.py
