name: security-release-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"
      - name: Secret scan source tree
        run: python scripts/secret_scan.py .
      - name: Security regression tests
        run: >-
          python -m pytest
          tests/test_security_p0_hardening.py
          tests/test_security_p1_hardening.py
          tests/test_omega_core.py
          tests/test_tool_gateway.py
          tests/test_config_loader_negative_cases.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate distribution artifacts
        run: python scripts/prepublish_artifact_check.py
      - name: Build clean source archive
        run: python scripts/build_clean_source_archive.py --output dist/OmegaWalls-source.zip
      - name: Upload clean release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-walls-release
          path: dist/
          if-no-files-found: error
