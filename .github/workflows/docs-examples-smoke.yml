name: docs-examples-smoke

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "integrations/**"
      - "README*.md"
      - ".github/workflows/docs-examples-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate public and integration documentation
        run: >-
          python -m pytest -q
          tests/test_docs_integrations_contract.py
          tests/test_docs_public_surface_contract.py
          tests/test_docs_examples.py
