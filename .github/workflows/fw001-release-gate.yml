name: fw001-release-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run frozen FW-001 core suite with coverage
        shell: bash
        run: |
          mapfile -t suite < <(grep -v '^\s*$' tests/fw001_core_suite.txt)
          python -m pytest "${suite[@]}" --cov=omega --cov-report=term-missing --cov-fail-under=85

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python scripts/check_fw001_perf_gate.py --profile dev --perf-overhead-max 0.15 --strict

  fw001-gate:
    needs: [coverage-gate, perf-gate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "FW-001 release gates passed"
